<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            text-align: center;
            padding: 50px;
        }
        .button {
            background-color: #ff6b81;
            border: none;
            color: white;
            padding: 15px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            margin: 10px 2px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Welcome to the Valentine's Day App!</h1>
    <p>Click the buttons below to spread some love!</p>
    <button class="button" onclick="alert('Happy Valentine's Day!')">Send Love</button>
    <button class="button" onclick="alert('You are amazing!')">Compliment</button>
    <button class="button" onclick="alert('You make me smile!')">Appreciate</button>
</body>
</html>
