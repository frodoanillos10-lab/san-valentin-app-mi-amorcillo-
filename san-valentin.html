<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Día de San Valentín</title>
    <style>
        body {
            background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
            animation: falling-hearts 2s linear infinite;
            text-align: center;
            font-family: 'Arial', sans-serif;
        }
        @keyframes falling-hearts {
            0% { background-position: 0; }
            100% { background-position: 100%; }
        }
        button {
            font-size: 20px;
            margin: 20px;
            padding: 10px 20px;
            color: white;
            background-color: #ff69b4;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        #yesButton:hover ~ #noButton {
            display: none;
        }
        #invitation {
            display: none;
            margin-top: 20px;
            font-size: 24px;
            color: #fff;
        }
    </style>
</head>
<body>
    <h1>¡Feliz Día de San Valentín!</h1>
    <button id="yesButton" onclick="showInvitation()">Sí</button>
    <button id="noButton">No</button>
    <div id="invitation">
        <p>¡Te amo!</p>
        <p>Fecha: 14 de febrero a las 21:00 horas</p>
        <p>Código de vestimenta: elegante</p>
    </div>
    <script>
        function showInvitation() {
            document.getElementById('invitation').style.display = 'block';
        }
    </script>
</body>
</html>
