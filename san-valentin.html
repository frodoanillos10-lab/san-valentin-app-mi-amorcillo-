<!DOCTYPE html>\n<html lang="es">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>San Valentín</title>\n    <style>\n        body {\n            margin: 0;\n            height: 100vh;\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            background: linear-gradient(90deg, rgba(255,0,150,1) 0%, rgba(255,128,0,1) 50%, rgba(255,0,150,1) 100%);\n            animation: gradient 5s ease infinite;\n            position: relative;\n            overflow: hidden;\n        }\n        @keyframes gradient {\n            0% { background-position: 0% 50%; }\n            50% { background-position: 100% 50%; }\n            100% { background-position: 0% 50%; }\n        }\n        .container {\n            text-align: center;\n            color: white;\n            position: relative;\n        }\n        .hearts {\n            position: absolute;\n            width: 100%;\n            height: 100%;\n            top: 0;\n            left: 0;\n            pointer-events: none;\n        }\n        .heart {\n            position: absolute;\n            width: 20px;\n            height: 20px;\n            background: red;\n            transform: rotate(45deg);\n            animation: fall 5s infinite;\n        }\n        @keyframes fall {\n            from {transform: translateY(-100vh) rotate(45deg);}\n            to {transform: translateY(100vh) rotate(45deg);}\n        }\n        button {\n            padding: 10px 20px;\n            font-size: 16px;\n            margin: 10px;\n            background-color: white;\n            border: none;\n            border-radius: 5px;\n            color: red;\n            cursor: pointer;\n            transition: background 0.3s, color 0.3s;\n        }\n        button:hover {\n            background-color: red;\n            color: white;\n        }\n    </style>\n</head>\n<body>\n    <div class="container">\n        <h1>¡Feliz Día de San Valentín!</h1>\n        <p>¡Te invito a celebrarlo conmigo!</p>\n        <button>Sí</button>\n        <button>No</button>\n        <div class="hearts">\n            <div class="heart" style="animation-delay: 0s;"></div>\n            <div class="heart" style="animation-delay: 1s;"></div>\n            <div class="heart" style="animation-delay: 2s;"></div>\n            <div class="heart" style="animation-delay: 3s;"></div>\n        </div>\n    </div>\n</body>\n</html>
